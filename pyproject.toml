[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netmonitor"
version = "1.0.0"
description = "Professional Desktop Network Monitoring Dashboard using PySide6 and psutil."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.0.0",
    "psutil>=5.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
netmonitor = "netmonitor.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
